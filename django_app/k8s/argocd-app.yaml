apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-stoc
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://gitea.kduner.duckdns.org/your-user/streamstoc.git
    targetRevision: main
    path: django_app/k8s/
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
