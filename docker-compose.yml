# =============================================================================
# docker-compose.yml — Unified services
# =============================================================================
# Switch activ: editează COMPOSE_PROFILES în .env (combină cu virgulă)
#
#   COMPOSE_PROFILES=streamlit              → Streamlit stoc
#   COMPOSE_PROFILES=django                 → Django stoc
#   COMPOSE_PROFILES=lotus                  → doar Lotus restaurant
#   COMPOSE_PROFILES=django,lotus           → stoc + restaurant
#   COMPOSE_PROFILES=django,calibre         → stoc + Calibre-Web (lectura.duckdns.org)
#   COMPOSE_PROFILES=django,cops            → stoc + COPS (carti.duckdns.org)
#   COMPOSE_PROFILES=lotus,cops             → restaurant + bibliotecă
#   COMPOSE_PROFILES=django,lotus,cops      → toate
#
# Infrastructura (traefik, duckdns) rulează mereu, fără profile.
# Configurații persistente în ./docker-configs/<serviciu>/config/
# Calea spre biblioteca de cărți: BOOKS_PATH în .env
#
# Comandă switch:
#   1. Editează .env → COMPOSE_PROFILES=...
#   2. docker compose up -d --build --remove-orphans
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # TRAEFIK — reverse proxy + SSL (Let's Encrypt via DuckDNS DNS challenge)
  # Rulează mereu. Dashboard dezactivat (securitate).
  # HTTP (80) → redirect automat la HTTPS (443).
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v2.11
    container_name: traefik
    restart: unless-stopped
    command:
      - --ping=true
      - --log.level=INFO
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik
      # HTTP → HTTPS redirect
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # HTTPS
      - --entrypoints.websecure.address=:443
      # Let's Encrypt via DuckDNS
      - --certificatesresolvers.myresolver.acme.dnschallenge=true
      - --certificatesresolvers.myresolver.acme.dnschallenge.provider=duckdns
      - --certificatesresolvers.myresolver.acme.dnschallenge.disablepropagationcheck=true
      - --certificatesresolvers.myresolver.acme.email=x3m444@gmail.com
      - --certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
    volumes:
      - ./letsencrypt:/letsencrypt
      # Docker socket read-only — necesar pentru provider; risc minim pe server dedicat
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
      - traefik
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      # Middleware: security headers (aplicat pe toate app-urile via router label)
      - "traefik.enable=true"
      - "traefik.http.middlewares.secheaders.headers.frameDeny=true"
      - "traefik.http.middlewares.secheaders.headers.browserXssFilter=true"
      - "traefik.http.middlewares.secheaders.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.secheaders.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.secheaders.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.secheaders.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.secheaders.headers.stsPreload=true"
      # Middleware: rate limiting
      - "traefik.http.middlewares.ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.ratelimit.ratelimit.period=1s"

  # ---------------------------------------------------------------------------
  # DUCKDNS — actualizează IP-ul dinamic la furnizorul DNS
  # Rulează mereu. Token din .env (nu hardcodat).
  # ---------------------------------------------------------------------------
  duckdns:
    image: lscr.io/linuxserver/duckdns:latest
    container_name: duckdns
    restart: unless-stopped
    environment:
      - SUBDOMAINS=incercari,carti,lectura
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=false
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
    # DuckDNS nu expune port HTTP — verificăm că procesul rulează via exit code
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f duckdns || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ---------------------------------------------------------------------------
  # STREAMLIT — aplicația originală
  # Activă când COMPOSE_PROFILES=streamlit
  # ---------------------------------------------------------------------------
  streamlit:
    profiles: [streamlit]
    build: .
    container_name: stoc_streamlit
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.stoc.rule=Host(`streamstoc.incercari.duckdns.org`)"
      - traefik.http.routers.stoc.entrypoints=websecure
      - traefik.http.routers.stoc.tls.certresolver=myresolver
      - "traefik.http.routers.stoc.tls.domains[0].main=incercari.duckdns.org"
      - "traefik.http.routers.stoc.tls.domains[0].sans=*.incercari.duckdns.org"
      - traefik.http.services.stoc.loadbalancer.server.port=8501
      - "traefik.http.routers.stoc.middlewares=secheaders,ratelimit"

  # ---------------------------------------------------------------------------
  # DJANGO — aplicația nouă
  # Activă când COMPOSE_PROFILES=django
  # ---------------------------------------------------------------------------
  django:
    profiles: [django]
    build: ./django_app
    container_name: stoc_django
    restart: unless-stopped
    env_file: .env
    environment:
      - SECRET_KEY=${DJANGO_SECRET_KEY}
      - DEBUG=${DJANGO_DEBUG:-False}
      - ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - TZ=Europe/Bucharest
    expose:
      - "8000"
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    # /tmp în memorie — Django/Gunicorn scriu fișiere temporare acolo
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Python e disponibil în imagine; curl nu e instalat implicit în slim
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request, sys; r=urllib.request.urlopen('http://localhost:8000/'); sys.exit(0 if r.status < 500 else 1)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.stoc.rule=Host(`stoc.incercari.duckdns.org`)"
      - traefik.http.routers.stoc.entrypoints=websecure
      - traefik.http.routers.stoc.tls.certresolver=myresolver
      - "traefik.http.routers.stoc.tls.domains[0].main=incercari.duckdns.org"
      - "traefik.http.routers.stoc.tls.domains[0].sans=*.incercari.duckdns.org"
      - traefik.http.services.stoc.loadbalancer.server.port=8000
      - "traefik.http.routers.stoc.middlewares=secheaders,ratelimit"

  # ---------------------------------------------------------------------------
  # LOTUS — aplicație Django gestiune restaurant (ASGI/daphne, WebSockets)
  # Activă când COMPOSE_PROFILES include "lotus"
  # Subdomain: lotus.incercari.duckdns.org
  # Sursă: submodul git ./djangolotus (github.com/x3m444/djangolotus)
  # ---------------------------------------------------------------------------
  lotus:
    profiles: [lotus]
    build: ./djangolotus
    container_name: lotus_app
    restart: unless-stopped
    env_file: .env
    environment:
      - SECRET_KEY=${LOTUS_SECRET_KEY}
      - DEBUG=${LOTUS_DEBUG:-False}
      - ALLOWED_HOSTS=${LOTUS_ALLOWED_HOSTS}
      - AUTH_ENABLED=${LOTUS_AUTH_ENABLED:-True}
      - TZ=Europe/Bucharest
    expose:
      - "8000"
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request, sys; r=urllib.request.urlopen('http://localhost:8000/'); sys.exit(0 if r.status < 500 else 1)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.lotus.rule=Host(`lotus.incercari.duckdns.org`)"
      - traefik.http.routers.lotus.entrypoints=websecure
      - traefik.http.routers.lotus.tls.certresolver=myresolver
      - traefik.http.services.lotus.loadbalancer.server.port=8000
      - "traefik.http.routers.lotus.middlewares=secheaders,ratelimit"

  # ---------------------------------------------------------------------------
  # CALIBRE-WEB — interfață web completă pentru biblioteca Calibre
  # Activă când COMPOSE_PROFILES include "calibre"
  # Subdomain: lectura.duckdns.org
  # Primă pornire: setează calea /books în UI → /books
  # ---------------------------------------------------------------------------
  calibre-web:
    profiles: [calibre]
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre_web
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Bucharest
    volumes:
      - ./docker-configs/calibre-web/config:/config
      - ${BOOKS_PATH:-./docker-configs/calibre-web/books}:/books:ro
    expose:
      - "8083"
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.calibre.rule=Host(`lectura.duckdns.org`)"
      - traefik.http.routers.calibre.entrypoints=websecure
      - traefik.http.routers.calibre.tls.certresolver=myresolver
      - traefik.http.services.calibre.loadbalancer.server.port=8083
      - "traefik.http.routers.calibre.middlewares=secheaders,ratelimit"

  # ---------------------------------------------------------------------------
  # COPS — OPDS + web browser PHP, ultra-ușor (~80MB RAM)
  # Activă când COMPOSE_PROFILES include "cops"
  # Subdomain: carti.duckdns.org
  # Config: docker-configs/cops/config/ (generat automat de linuxserver)
  # ---------------------------------------------------------------------------
  cops:
    profiles: [cops]
    image: lscr.io/linuxserver/cops:latest
    container_name: cops
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=Europe/Bucharest
    volumes:
      - ./docker-configs/cops/config:/config
      - ${BOOKS_PATH:-./docker-configs/calibre-web/books}:/books:ro
    expose:
      - "80"
    networks:
      - traefik
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.3"
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/index.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      - traefik.enable=true
      - "traefik.http.routers.cops.rule=Host(`carti.duckdns.org`)"
      - traefik.http.routers.cops.entrypoints=websecure
      - traefik.http.routers.cops.tls.certresolver=myresolver
      - traefik.http.services.cops.loadbalancer.server.port=80
      - "traefik.http.routers.cops.middlewares=secheaders,ratelimit"

# =============================================================================
# REȚELE
# =============================================================================
networks:
  traefik:
    name: traefik
