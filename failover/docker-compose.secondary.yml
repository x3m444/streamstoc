services:
  duckdns:
    environment:
      - SUBDOMAINS=
      - TOKEN=${DUCKDNS_TOKEN}
      - LOG_FILE=false

  healthcheck:
    image: python:3.11-alpine
    container_name: secondary_health
    restart: unless-stopped
    command: >
      sh -c "printf 'import http.server\nclass H(http.server.BaseHTTPRequestHandler):\n def do_GET(self):\n  if self.path == \"/ready\": self.send_response(200); self.end_headers(); self.wfile.write(b\"{\\\"status\\\":\\\"ready\\\"}\")\n  else: self.send_response(404); self.end_headers()\n def log_message(self, *a): pass\nhttp.server.HTTPServer((\"0.0.0.0\", 8888), H).serve_forever()' | python3"
    ports:
      - "8888:8888"
    deploy:
      resources:
        limits:
          memory: 32M
          cpus: "0.1"
